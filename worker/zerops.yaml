zerops:
  - setup: worker
    build:
      base: python@3.11
      buildCommands:
        - pip install --target=./vendor -r requirements.txt
      deployFiles:
        - .
    run:
      base: python@3.11
      start: python -u main.py
      envVariables:
        PYTHONPATH: /var/www/vendor
        DB_HOST: ${db_hostname}
        DB_USER: ${db_user}
        DB_PASSWORD: ${db_password}
        DB_NAME: ${db_dbName}
        NATS_URL: nats://${queue_hostname}:${queue_port}
        NATS_USER: ${queue_user}
        NATS_PASS: ${queue_password}
        S3_ENDPOINT: ${storage_apiUrl}
        S3_ACCESS_KEY: ${storage_accessKeyId}
        S3_SECRET_KEY: ${storage_secretAccessKey}
        S3_BUCKET: ${storage_bucketName}
